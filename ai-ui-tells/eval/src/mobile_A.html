<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f4f6;color:#111827;font-size:15px}
.hdr{padding:24px 20px 56px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.hdr h1{font-size:20px;font-weight:600;margin:0}.hdr p{margin:4px 0 0;font-size:14px;opacity:.85}
.bal{margin:-40px 16px 16px;padding:20px;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.1)}.bal small{font-size:13px;color:#6b7280}.bal div{font-size:26px;font-weight:600}
.live{display:inline-block;padding:3px 10px;border-radius:9999px;background:#fee2e2;color:#dc2626;font-size:11px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 16px}
.st{padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.08);text-align:center}.st .e{font-size:22px}.st b{display:block;font-size:16px;font-weight:600}.st span{font-size:12px;color:#6b7280}
.sec{margin:0 16px 16px;padding:8px 16px;border-radius:20px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.08)}.sec h2{font-size:16px;font-weight:600;margin:10px 0}
.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px}.pill{padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:#ede9fe;color:#7c3aed}
.tog{width:44px;height:26px;border-radius:9999px;background:linear-gradient(90deg,#6366f1,#a855f7)}
</style><style id="polish">
.st,.sec,.bal{backdrop-filter:blur(12px);background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.6);border-radius:24px;box-shadow:0 12px 30px rgba(99,102,241,.18)}
.hdr{background:radial-gradient(circle at 80% 0,#f0abfc,transparent 50%),linear-gradient(135deg,#4f46e5,#9333ea)}
.hdr h1{font-size:22px}
</style></head><body>
<div class="hdr"><h1>Good morning, Sam 👋</h1><p>Here's your overview</p></div>
<div class="bal"><small>Outstanding</small> <span class="live">● LIVE</span><div>$12,480</div></div>
<div class="stats"><div class="st"><div class="e">💰</div><b>$8.2k</b><span>Paid</span></div><div class="st"><div class="e">⏳</div><b>$3.1k</b><span>Due</span></div><div class="st"><div class="e">⚠️</div><b>$1.2k</b><span>Late</span></div></div>
<div class="sec"><h2>⚙️ Settings</h2><div class="it"><span>🔔 Payment reminders</span><div class="tog"></div></div><div class="it"><span>🌍 Currency</span><span class="pill">USD</span></div><div class="it"><span>🧾 Invoice template</span><span class="pill">Modern</span></div><div class="it"><span>✨ AI suggestions</span><span class="pill">Beta</span></div></div>
</body></html>
