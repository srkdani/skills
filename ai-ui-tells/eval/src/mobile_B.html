<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
:root{--brand:#0F766E;--bg:#FAFAF9;--line:#E7E5E4;--muted:#57534E;--ink:#1C1917;--late:#B91C1C;--r1:6px;--r2:12px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.pad{padding:24px 16px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hero{padding:8px 0 24px;border-bottom:1px solid var(--line)}
.num{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.sub{color:var(--muted)}.sub b{color:var(--late);font-weight:600}
.bar{display:flex;height:8px;border-radius:var(--r1);overflow:hidden;margin:16px 0 8px}.bar i{display:block}
.leg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btn{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:var(--r1);background:var(--brand);color:#fff;font-weight:600}
h2{font-size:20px;font-weight:600;margin:24px 0 8px}
.grp{background:#fff;border:1px solid var(--line);border-radius:var(--r2)}
.it{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.val{color:var(--muted)}
.tog{width:40px;height:24px;border-radius:12px;background:var(--brand);position:relative}.tog:after{content:"";position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:10px;background:#fff}
.tog.off{background:#D6D3D1}.tog.off:after{right:auto;left:2px}
</style></head><body><div class="pad">
<div class="hero"><div class="lbl">Outstanding</div><div class="num">$12,480</div><div class="sub">$3,100 due this week, <b>$1,200 late</b></div>
<div class="bar"><i style="width:66%;background:var(--brand)"></i><i style="width:24%;background:#99C5C0"></i><i style="width:10%;background:var(--late)"></i></div>
<div class="leg"><span>Paid $8.2k</span><span>Due $3.1k</span><span>Late $1.2k</span></div>
<a class="btn">Remind 2 late clients</a></div>
<h2>Settings</h2>
<div class="grp"><div class="it"><span>Payment reminders</span><div class="tog"></div></div><div class="it"><span>Currency</span><span class="val">USD</span></div><div class="it"><span>Invoice template</span><span class="val">Modern</span></div><div class="it"><span>Suggested reminder text</span><div class="tog off"></div></div></div>
</div></body></html>
